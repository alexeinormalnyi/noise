<!DOCTYPE html>
<html>
<head>
    <link rel="icon" type="image/x-icon" href="icon.ico">
<style>
  * {
    cursor: url('crabi.ico'), auto;
  }

  *:active {
    cursor: url('crabiclicked.ico'), auto;
  }

  body {
    background-color: #000080;
    color: #00ff00;
    font-family: "Courier New", Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 10vh;
    min-height: 100vh;
    margin: 0;
  }

  h1 {
    font-size: 3rem;
    text-transform: uppercase;
    border: 3px double #00ff00;
    padding: 10px;
    margin-bottom: 5px;
    text-shadow: 2px 2px #ff00ff;
    text-align: center;
  }

  .tagline-container {
    width: 100%;
    text-align: center;
    margin-bottom: 50px;
  }

  .tagline {
    font-style: italic;
    font-weight: bold;
    color: #ffff00;
    text-decoration: underline;
  }

  select {
    background: #c0c0c0;
    color: #000;
    font-family: inherit;
    font-weight: bold;
    padding: 10px;
    border: 4px inset #fff;
    width: 90%;
    max-width: 500px;
  }

  #music-list {
    margin-top: 30px;
    background: #000;
    border: 2px dashed #00ff00;
    padding: 20px;
    display: none;
    width: 90%;
    max-width: 500px;
    text-align: left;
  }

  .track {
    margin: 10px 0;
    padding: 5px;
    border-bottom: 1px solid #00ff00;
    font-size: 0.9rem;
  }

  .track.active {
    background: #00ff00;
    color: #000;
  }

  .track:hover {
    background: #00ff00;
    color: #000;
  }

  audio {
    margin-top: 20px;
    filter: invert(100%);
    width: 100%;
  }

  footer {
    margin-top: auto;
    padding: 20px;
    font-size: 0.8rem;
    color: #00ff00;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <h1>Alexei Normalnyi</h1>
  
  <div class="tagline-container">
    <span class="tagline">i make noise</span>
  </div>

  <select id="album-select" onchange="toggleAlbum()">
    <option value="">-- SELECT ALBUM --</option>
    <option value="cspg">Constant Stimulation of Penial Glands</option>
  </select>

  <div id="music-list">
    <div class="track" data-file="Third World War.mp3" onclick="playTrack(this)">[PLAY] 01_Third World War.mp3</div>
    <div class="track" data-file="Last Breaths of Baal.mp3" onclick="playTrack(this)">[PLAY] 02_Last Breaths of Baal.mp3</div>
    <div class="track" data-file="The Fourth Coming of Christ.mp3" onclick="playTrack(this)">[PLAY] 03_The Fourth Coming of Christ.mp3</div>
    <div class="track" data-file="WeCantKeepTheIntercontinentalPeace.mp3" onclick="playTrack(this)">[PLAY] 04_WeCantKeepTheIntercontinentalPeace.mp3</div>
      
    <audio id="player" controls></audio>
  </div>

  <footer>
    © 2026 copyright by Leha Normalnyi
  </footer>

  <script>
    const player = document.getElementById('player');
    const select = document.getElementById('album-select');
    const list = document.getElementById('music-list');

    function toggleAlbum() {
      list.style.display = select.value === 'cspg' ? 'block' : 'none';
    }

    function playTrack(element) {
      const allTracks = document.querySelectorAll('.track');
      allTracks.forEach(t => t.classList.remove('active'));
      
      element.classList.add('active');
      player.src = element.getAttribute('data-file');
      player.load(); 
      
      const playPromise = player.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => { console.log("Interaction required."); });
      }
    }

    player.addEventListener('ended', function() {
      const currentTrack = document.querySelector('.track.active');
      if (currentTrack) {
        const nextTrack = currentTrack.nextElementSibling;
        if (nextTrack && nextTrack.classList.contains('track')) {
          playTrack(nextTrack);
        }
      }
    });

    window.onload = function() {
      toggleAlbum();
    };
  </script>

</body>
</html>
