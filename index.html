<!DOCTYPE html>
<html>
<head>
    <link rel="icon" type="image/x-icon" href="icon.ico">
<style>
  * {
    cursor: url('icon.ico'), auto;
  }

  *:active {
    cursor: url('iconclicked.ico'), auto;
  }

  body {
    background-color: #000080;
    background-image: none;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    transition: background-image 0.8s ease-in-out;
    
    color: #00ff00;
    font-family: "Courier New", Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 10vh;
    min-height: 100vh;
    margin: 0;
  }

  h1 {
    font-size: 3rem;
    text-transform: uppercase;
    border: 3px double #00ff00;
    padding: 10px;
    margin-bottom: 5px;
    text-shadow: 2px 2px #ff00ff;
    text-align: center;
    background: rgba(0, 0, 128, 0.7);
    transition: all 0.5s ease;
  }

  .tagline-container {
    width: 100%;
    text-align: center;
    margin-bottom: 50px;
    min-height: 1.5em;
  }

  .tagline {
    font-style: italic;
    font-weight: bold;
    color: #ffff00;
    text-decoration: underline;
    background: rgba(0, 0, 0, 0.5);
    padding: 2px 10px;
    display: inline-block;
    animation: fadeIn 0.5s ease-in;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  select {
    background: #c0c0c0;
    color: #000;
    font-family: inherit;
    font-weight: bold;
    padding: 10px;
    border: 4px inset #fff;
    width: 90%;
    max-width: 500px;
  }

  .music-container {
    margin-top: 30px;
    background: rgba(0, 0, 0, 0.85);
    border: 2px dashed #00ff00;
    padding: 20px;
    display: none;
    width: 90%;
    max-width: 500px;
    text-align: left;
  }

  .track {
    margin: 10px 0;
    padding: 5px;
    border-bottom: 1px solid #00ff00;
    font-size: 0.9rem;
    cursor: pointer;
  }

  .track.active {
    background: #00ff00;
    color: #000;
  }

  .track:hover {
    background: #00ff00;
    color: #000;
  }

  audio {
    margin-top: 20px;
    filter: invert(100%);
    width: 100%;
  }

  footer {
    margin-top: auto;
    padding: 20px;
    font-size: 0.8rem;
    color: #00ff00;
    text-transform: uppercase;
    background: rgba(0, 0, 0, 0.5);
  }
</style>
</head>
<body>

  <h1 id="main-title">Потлатий & Партнери</h1>
  
  <div class="tagline-container">
    <span id="tagline" class="tagline">roma loh</span>
  </div>

  <select id="album-select" onchange="toggleAlbum()">
    <option value="">-- SELECT ALBUM --</option>
    <option value="22" data-tag="Album 22">22</option>
    <option value="cspg" data-tag="Constant Stimulation of Penial Glands">Constant Stimulation of Penial Glands</option>
    <option value="cvp" data-tag="Clip v Parische">Clip v Parische</option>
  </select>

  <!-- Album 22 -->
  <div id="list-22" class="music-container">
    <div class="track" data-file="blyuaha muha.mp3" onclick="playTrack(this)">[PLAY] blyuaha muha.mp3</div>
    <div class="track" data-file="22.mp3" onclick="playTrack(this)">[PLAY] 22.mp3</div>
    <!-- Add other tracks as needed -->
  </div>

  <!-- CSPG -->
  <div id="list-cspg" class="music-container">
    <div class="track" data-file="Constant Stimulation of Penial Glands.mp3" onclick="playTrack(this)">[PLAY] 01_Constant Stimulation of Penial Glands.mp3</div>
  </div>

  <!-- Clip v Parische -->
  <div id="list-cvp" class="music-container">
    <div class="track" data-file="Clip v Parische.mp3" onclick="playTrack(this)">[PLAY] Clip v Parische.mp3</div>
  </div>

  <audio id="player" controls style="margin-top: 20px; width: 90%; max-width: 500px; filter: invert(100%); display: none;"></audio>

  <footer>
    © 2026 copyright by Потлатий & Партнери
  </footer>

  <script>
    const player = document.getElementById('player');
    const select = document.getElementById('album-select');
    const title = document.getElementById('main-title');
    const tagline = document.getElementById('tagline');

    function toggleAlbum() {
      const lists = document.querySelectorAll('.music-container');
      const selectedOption = select.options[select.selectedIndex];
      
      lists.forEach(l => l.style.display = 'none');
      
      // Handle Title Change
      if (select.value === 'cspg') {
        title.innerText = "Constant Stimulation of Penial Glands";
      } else {
        title.innerText = "Потлатий & Партнери";
      }

      // Handle Tagline Animation
      if (select.value !== "") {
        tagline.style.animation = 'none';
        tagline.offsetHeight; // trigger reflow
        tagline.style.animation = 'fadeIn 0.5s ease-in';
        tagline.innerText = selectedOption.getAttribute('data-tag');
      }

      // Show/Hide Lists
      if (select.value === '22') {
        document.getElementById('list-22').style.display = 'block';
        player.style.display = 'block';
      } else if (select.value === 'cspg') {
        document.getElementById('list-cspg').style.display = 'block';
        document.body.style.backgroundImage = "url('csopgnew.png')";
        player.style.display = 'block';
      } else if (select.value === 'cvp') {
        document.getElementById('list-cvp').style.display = 'block';
        player.style.display = 'block';
      } else {
        document.body.style.backgroundImage = "none";
        player.style.display = 'none';
      }
    }

    function playTrack(element) {
      const allTracks = document.querySelectorAll('.track');
      allTracks.forEach(t => t.classList.remove('active'));
      element.classList.add('active');
      player.src = element.getAttribute('data-file');
      player.load(); 
      player.play().catch(e => console.log("Play failed"));
    }

    player.addEventListener('ended', function() {
      const currentTrack = document.querySelector('.track.active');
      if (currentTrack && currentTrack.nextElementSibling) {
        playTrack(currentTrack.nextElementSibling);
      }
    });
  </script>
</body>
</html>
